name: Release

# Push a tag like v1.2.0 to build all executables, check that they are reproducible, sign their
# provenance and publish them as a GitHub Release.
# Dry run: Actions tab > Release > "Run workflow" builds and checks everything, then stops before signing
# and publishing (no tag, no release). Use it after changing this file.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            goos: windows
            goarch: amd64
            out: isthisconnected.exe
          - os: ubuntu-latest
            goos: linux
            goarch: amd64
            out: isthisconnected-linux-amd64
          - os: ubuntu-latest
            goos: linux
            goarch: arm64
            out: isthisconnected-linux-arm64
          - os: macos-latest # Apple Silicon runner; the Intel build is cross-compiled with clang -arch
            goos: darwin
            goarch: arm64
            out: isthisconnected-macos-arm64
          - os: macos-latest
            goos: darwin
            goarch: amd64
            out: isthisconnected-macos-amd64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod

      - name: Allow unprivileged ping (Linux runner)
        if: matrix.goos == 'linux'
        run: sudo sysctl -w net.ipv4.ping_group_range="0 2147483647"

      - name: Test
        if: matrix.goarch == 'amd64' || matrix.goos == 'darwin'
        run: go test -short ./...

      - name: Build
        shell: bash
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: ${{ matrix.goos == 'darwin' && '1' || '0' }} # macOS needs cgo (CoreWLAN, tray)
        run: |
          flags="-s -w"
          if [ "$GOOS" = windows ]; then flags="-H windowsgui $flags"; fi
          go build -trimpath -ldflags "$flags" -o "${{ matrix.out }}" .

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.out }}
          path: ${{ matrix.out }}

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write     # create the release
      id-token: write     # sign the attestations (Sigstore)
      attestations: write # store them on GitHub
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod

      # Outside the checkout: Go stamps "vcs.modified=true" into a binary built next to untracked files,
      # which would make the rebuild below differ from the release builds.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: ${{ runner.temp }}/dist
          merge-multiple: true

      # Rebuild here, on a different machine (Linux instead of Windows for the .exe), and require
      # byte-identical results: proof that the executables contain exactly this source code.
      # macOS builds go through Apple's C toolchain (cgo) and are not checked.
      - name: Check that the builds are reproducible
        run: |
          test -z "$(git status --porcelain)" || { echo "::error::the checkout is not clean"; git status --porcelain; exit 1; }
          out="$RUNNER_TEMP/rebuild"
          mkdir "$out"
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -trimpath -ldflags "-H windowsgui -s -w" -o "$out/isthisconnected.exe" .
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags "-s -w" -o "$out/isthisconnected-linux-amd64" .
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -trimpath -ldflags "-s -w" -o "$out/isthisconnected-linux-arm64" .
          for f in "$out"/*; do
            cmp "$f" "$RUNNER_TEMP/dist/$(basename "$f")" || { echo "::error::$(basename "$f") is not reproducible"; exit 1; }
            echo "reproducible: $(basename "$f")"
          done

      # Signed SLSA build provenance: links each file to this repository, commit and workflow run.
      # Verify with: gh attestation verify <file> --repo martiro/IsThisConnected
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        if: github.event_name == 'push' # only for a real release (tag push), never in a dry run
        with:
          subject-path: ${{ runner.temp }}/dist/isthisconnected*

      - name: Dry run summary
        if: github.event_name != 'push'
        run: |
          {
            echo "### Dry run: nothing signed or published"
            echo "All builds succeeded and the Windows and Linux ones are reproducible. Files that a release would publish:"
            echo '```'
            cd "$RUNNER_TEMP/dist" && sha256sum *
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publish release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd "$RUNNER_TEMP/dist"
          sha256sum * > SHA256SUMS
          gh release create "$GITHUB_REF_NAME" * --repo "$GITHUB_REPOSITORY" \
            --title "IsThisConnected $GITHUB_REF_NAME" --generate-notes \
            --notes "**Windows** is the tested platform. **Linux and macOS builds are experimental**: they compile and pass the automated tests on GitHub's machines but have not been tried on a real WiFi connection yet. Feedback is very welcome, see [Help wanted](https://github.com/$GITHUB_REPOSITORY#help-wanted-linux-and-macos-testers).

          Every file has a signed build provenance attestation and the Windows and Linux builds are reproducible: see [Verifying downloads](https://github.com/$GITHUB_REPOSITORY#verifying-downloads)."
