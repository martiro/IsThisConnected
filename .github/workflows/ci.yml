name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      # Actions are pinned to a commit hash (not a movable tag); Dependabot proposes updates.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod

      - name: Check formatting
        shell: bash
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then echo "Run gofmt on:"; echo "$unformatted"; exit 1; fi

      - name: Vet
        run: go vet ./...

      # Known vulnerabilities in our code paths, the dependencies and the Go standard library.
      - name: Vulnerability check
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.10.0 ./...

      # -short skips TestNativeAPIs (needs a WiFi adapter). TestPlatformBasics still runs the native
      # calls that work on a CI machine: loopback ping, CPU time, default route, adapter counters.
      - name: Ping permission (Linux)
        if: runner.os == 'Linux'
        # GitHub's Linux machines disable unprivileged ping; desktop distributions enable it by default.
        run: |
          echo "::notice title=ping_group_range (runner default)::$(cat /proc/sys/net/ipv4/ping_group_range)"
          sudo sysctl -w net.ipv4.ping_group_range="0 2147483647"

      # Failing test lines are also published as annotations, so they show in the run summary.
      - name: Test
        shell: bash
        run: |
          set -o pipefail
          go test -short -v ./... 2>&1 | tee test.log || {
            grep -E -- "--- FAIL|_test\.go:[0-9]+:|panic:" test.log | head -20 | while IFS= read -r line; do echo "::error::$line"; done
            exit 1
          }

      - name: Build
        shell: bash
        run: |
          if [ "$RUNNER_OS" = Windows ]; then
            go build -trimpath -ldflags "-H windowsgui -s -w" -o isthisconnected.exe .
          else
            go build -trimpath -ldflags "-s -w" -o isthisconnected .
          fi
