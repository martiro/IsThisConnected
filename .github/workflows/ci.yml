name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Check formatting
        shell: bash
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then echo "Run gofmt on:"; echo "$unformatted"; exit 1; fi

      - name: Vet
        run: go vet ./...

      # -short skips the native test: hosted runners have no WiFi adapter and block ICMP.
      - name: Test
        run: go test -short ./...

      - name: Build
        run: go build -trimpath -ldflags "-H windowsgui -s -w" -o isthisconnected.exe .
