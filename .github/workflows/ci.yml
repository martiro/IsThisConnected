name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Check formatting
        shell: bash
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then echo "Run gofmt on:"; echo "$unformatted"; exit 1; fi

      - name: Vet
        run: go vet ./...

      # -short skips TestNativeAPIs (needs a WiFi adapter). TestPlatformBasics still runs the native
      # calls that work on a CI machine: loopback ping, CPU time, default route, adapter counters.
      - name: Test
        run: go test -short -v ./...

      - name: Build
        shell: bash
        run: |
          if [ "$RUNNER_OS" = Windows ]; then
            go build -trimpath -ldflags "-H windowsgui -s -w" -o isthisconnected.exe .
          else
            go build -trimpath -ldflags "-s -w" -o isthisconnected .
          fi
